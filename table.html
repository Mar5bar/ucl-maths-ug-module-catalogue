<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCL BSc/MSci Mathematics Module Catalogue</title>
    <link rel="stylesheet" href="UCL-sans/ucl-sans.css" />
    <link rel="stylesheet" href="table.css" />
  </head>
  <body>
    <header>
      <h1>UCL BSc/MSci Mathematics Module Catalogue</h1>
    </header>

    <main>
      <div id="intro">
        <div id="yoe-button-row" class="year-select">
          Year of entry:
          <button
            class="year-button"
            type="button"
            onclick="setYearOfEntryHandler(this)"
            data-year="latest"
          >
            2026
          </button>
        </div>
        <p>
          Welcome to the UCL BSc/MSci Mathematics module catalogue.<br />
          Modules are listed below with their prerequisites and follow-on
          modules. A graphical version of the programme structure can be found
          <a href="index.html">here</a>.
        </p>
      </div>
      <div id="module-grid"></div>
    </main>
  </body>
  <script src="table.js"></script>
</html>
